# T06: Price and cost assumptions for the cost analysis (T14, T17, T19).
#
# All prices are US dollars per 1 million tokens, checked 2026-11-14.
# These are cited ASSUMPTIONS, not data: RAGTruth contains token counts
# (from T05) but no prices. T19 reruns the analysis at half and double
# these values to test whether the conclusions hold.

checked_on: "2026-11-14"
currency: USD
unit: per_1M_tokens

# ---------------------------------------------------------------------------
# Generation prices for the six RAGTruth models.
# Keys match the `model` column in data/responses_clean.csv exactly.
# ---------------------------------------------------------------------------
models:
  gpt-4-0613:
    type: cloud
    input: 30.00
    output: 60.00
    source: openai_gpt4
    note: >-
      OpenAI lists one price for GPT-4 and its gpt-4-0613 snapshot. The model
      is now shut down, so this is its last published price.

  gpt-3.5-turbo-0613:
    type: cloud
    input: 0.50
    output: 1.50
    source: openai_gpt35
    note: >-
      OpenAI's model page lists $0.50 / $1.50 for GPT-3.5 Turbo but no
      separate price for the 0613 snapshot used in RAGTruth. We use the
      listed family price; the 2023 snapshot was billed at a different rate.

  llama-2-7b-chat:
    type: local
    input: 0.20
    output: 0.20
    source: together_llama_mistral
    note: Hosted-API price used as a proxy for the cost of running locally.

  llama-2-13b-chat:
    type: local
    input: 0.30
    output: 0.30
    source: together_llama_mistral
    note: Hosted-API price used as a proxy for the cost of running locally.

  llama-2-70b-chat:
    type: local
    input: 0.90
    output: 0.90
    source: together_llama_mistral
    note: Hosted-API price used as a proxy for the cost of running locally.

  mistral-7B-instruct:
    type: local
    input: 0.20
    output: 0.20
    source: together_llama_mistral
    note: >-
      Source lists Mistral 7B v0.1; we apply the same 7B rate to the
      Instruct version used in RAGTruth. Hosted-API proxy for local cost.

# ---------------------------------------------------------------------------
# Checking ("evaluator") costs, compared in T14 and T17.
# ---------------------------------------------------------------------------
judges:
  # The LLM judge the RAGTruth paper compared against (2023 era).
  llm_judge_gpt4:
    model: gpt-4-0613
    input: 30.00
    output: 60.00
    source: openai_gpt4
  # A current mid-tier OpenAI model as a modern LLM judge.
  llm_judge_current:
    model: gpt-6.1-sol
    input: 2.00
    output: 10.00
    source: openai_pricing

# Tokens an LLM judge uses per check (ASSUMPTIONS):
# input = the answer's prompt + response + a grading instruction;
# output = a short verdict.
judge_overhead:
  instruction_tokens: 200
  output_tokens: 50

# Our trained classifier runs on a laptop CPU in milliseconds.
classifier_cost_per_check: 0.0

# ---------------------------------------------------------------------------
# Guardrail decision costs for the threshold analysis (T17) (ASSUMPTIONS).
# ---------------------------------------------------------------------------
guardrail:
  # A blocked answer is regenerated by this cloud model (local-first fallback).
  fallback_model: gpt-4-0613
  # Business cost of one hallucination that reaches a customer, in USD.
  # No published source: a stated assumption, varied in T19.
  miss_cost_usd: 1.00

# ---------------------------------------------------------------------------
# Sensitivity analysis settings (T19).
# ---------------------------------------------------------------------------
sensitivity:
  price_multipliers: [0.5, 1.0, 2.0]
  miss_cost_usd_values: [0.10, 1.00, 10.00]

# ---------------------------------------------------------------------------
# Sources (APA 7 references are listed in README.md, section T06).
# ---------------------------------------------------------------------------
sources:
  openai_gpt4: https://developers.openai.com/api/docs/models/gpt-4
  openai_gpt35: https://developers.openai.com/api/docs/models/gpt-3.5-turbo
  openai_pricing: https://developers.openai.com/api/docs/pricing
  together_llama_mistral: https://www.llmreference.com/provider/together-ai-api
